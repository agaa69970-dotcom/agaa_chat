name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash "$(ls -S chat_setup*.sh | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name agaa_chat --org com.agaa
      - run: bash "$(ls -S chat_setup*.sh | head -1)"
      - name: compress native libs
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$f"
          fi
      - run: flutter pub get
      - name: build
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AgaaChat.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk AgaaChat_32bit.apk
      - name: verify
        run: |
          unzip -tq AgaaChat.apk
          unzip -tq AgaaChat_32bit.apk
          ls -l *.apk | awk '{print $5, $9}' > notes.txt
          sha256sum *.apk >> notes.txt
          cat notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Agaa Chat v${{ github.run_number }}
          body_path: notes.txt
          files: |
            AgaaChat.apk
            AgaaChat_32bit.apk
