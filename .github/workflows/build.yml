name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash chat_setup*.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter create . --platforms=android --project-name agaa_chat --org com.agaa
      - run: bash chat_setup*.sh
      - run: flutter pub get
      - name: build chat
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AgaaChat_arm64.apk
      - name: build bare new flutter
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          flutter create bare --platforms=android --org com.agaa
          cd bare
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/Bare_new.apk"
      - name: notes
        run: |
          ls -l *.apk | awk '{print $5, $9}' > notes.txt
          sha256sum *.apk >> notes.txt
          cat notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Agaa Chat v${{ github.run_number }}
          body_path: notes.txt
          files: |
            AgaaChat_arm64.apk
            Bare_new.apk
