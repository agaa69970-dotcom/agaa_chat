name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash "$(ls -S chat_setup*.sh | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name agaa_chat --org com.agaa
      - run: bash "$(ls -S chat_setup*.sh | head -1)"
      - run: flutter pub get
      - name: build
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AgaaChat.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk AgaaChat_32bit.apk
          ls -l *.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Agaa Chat v${{ github.run_number }}
          files: |
            AgaaChat.apk
            AgaaChat_32bit.apk
